<body data-page="staff">
<main class="staff-shell">
  <header class="staff-topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><i data-lucide="radiation"></i></span><span><strong>TOXIC APPEALS CENTER</strong><em>Staff Review</em></span></a><div class="staff-actions"><span class="staff-role" id="staff-role"><i data-lucide="shield-check"></i>Checking access</span><button class="button" id="staff-signin-twitch" type="button" hidden>Sign in with Twitch</button><button class="button" id="staff-signin-discord" type="button" hidden>Sign in with Discord</button><button class="button button--outline" id="staff-switch" type="button" hidden>Switch account</button><button class="button button--outline" id="staff-logout" type="button" hidden>Sign out</button><a class="back-link" href="./"><i data-lucide="arrow-left"></i> Public portal</a><a class="central-link" href="../"><i data-lucide="layout-dashboard"></i> Central Command</a></div></header>
  <section class="staff-title"><div><span class="kicker">MODERATION OPERATIONS</span><h1>Appeal review queue</h1><p>Review the record, document the decision, and send one clear response.</p></div><div class="staff-stat"><i data-lucide="clock-3"></i><span><strong id="active-count">0</strong> active cases</span></div></section>
  <div id="staff-notice" hidden></div>
  <section class="staff-workspace" id="staff-workspace" hidden>
    <aside class="queue"><div class="queue-tools"><div class="search-wrap"><i data-lucide="search"></i><input id="staff-search" placeholder="Case or username"></div><div class="filter-row platform-filter-row" id="platform-filter-row"><i data-lucide="layers-3"></i><button class="active" data-platform="all">all</button><button data-platform="discord">discord</button><button data-platform="twitch">twitch</button><button data-platform="youtube">youtube</button><button data-platform="kick">kick</button><button data-platform="tiktok">tiktok</button><button data-platform="instagram">instagram</button><button data-platform="x_twitter">x / twitter</button></div><div class="filter-row" id="filter-row"><i data-lucide="filter"></i><button class="active" data-status="all">all</button><button data-status="submitted">submitted</button><button data-status="under_review">under review</button><button data-status="needs_information">needs information</button><button data-status="accepted">accepted</button><button data-status="denied">denied</button><button data-status="closed">closed</button></div></div><div class="queue-list" id="queue-list"><div class="loading-row">Loading cases…</div></div></aside>
    <section class="case-review" id="case-review"><div class="empty-review"><i data-lucide="user-round"></i><h2>Select a case</h2><p>Choose an appeal from the queue to review its full record.</p></div></section>
  </section>
