<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050807">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://static-cdn.jtvnw.net data:; connect-src https://ubldjtsjfudogtgxakiq.supabase.co; base-uri 'self'; frame-ancestors 'none'">
  <title>Staff Review | ThyToxicGamer Appeals</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
  <style>[hidden]{display:none!important}.button{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid #35413b;border-radius:4px;padding:.68rem 1rem;background:#161c19;color:#eef5f1;cursor:pointer;font-weight:800}.button:disabled{cursor:not-allowed;opacity:.55}.staff-shell>.notice{margin-bottom:1rem}.staff-actions{display:flex;align-items:center;gap:1rem}</style>
</head>
<body data-page="staff">
<main class="staff-shell">
  <header class="staff-topbar"><a class="brand" href="./"><span class="toxic-mark toxic-mark--small"><span class="toxic-mark__orbit"></span><svg viewBox="0 0 96 96"><path d="M48 38c-10-21-31-12-30 4 0 9 8 15 18 15-10 5-14 16-9 24 9 14 29 7 29-9 4 15 24 18 31 4 5-11-4-22-17-21 12-6 14-21 4-29-12-11-25-3-26 12Z"></path><circle cx="48" cy="53" r="9"></circle></svg></span><span><strong>THY TOXIC</strong><em>STAFF REVIEW</em></span></a><div class="staff-actions"><span class="staff-role" id="staff-role"><i data-lucide="shield-check"></i>Checking access</span><button class="button" id="staff-signin" type="button" hidden>Sign in with Twitch</button><button class="button" id="staff-logout" type="button" hidden>Sign out</button><a class="back-link" href="./"><i data-lucide="arrow-left"></i> Public portal</a></div></header>
  <section class="staff-title"><div><span class="kicker">MODERATION OPERATIONS</span><h1>Appeal review queue</h1><p>Review the record, document the decision, and send one clear response.</p></div><div class="staff-stat"><i data-lucide="clock-3"></i><span><strong id="active-count">0</strong> active cases</span></div></section>
  <div id="staff-notice" hidden></div>
  <section class="staff-workspace" id="staff-workspace" hidden>
    <aside class="queue"><div class="queue-tools"><div class="search-wrap"><i data-lucide="search"></i><input id="staff-search" placeholder="Case or username"></div><div class="filter-row" id="filter-row"><i data-lucide="filter"></i><button class="active" data-status="all">all</button><button data-status="submitted">submitted</button><button data-status="under_review">under review</button><button data-status="needs_information">needs information</button><button data-status="accepted">accepted</button><button data-status="denied">denied</button><button data-status="closed">closed</button></div></div><div class="queue-list" id="queue-list"><div class="loading-row">Loading cases…</div></div></aside>
    <section class="case-review" id="case-review"><div class="empty-review"><i data-lucide="user-round"></i><h2>Select a case</h2><p>Choose an appeal from the queue to review its full record.</p></div></section>
  </section>
</main>
</body>
</html>
